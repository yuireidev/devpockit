name: Dependency Review

on:
  pull_request:
    branches: [main, develop]
    paths:
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail_on_severity: moderate
