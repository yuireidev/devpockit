name: Preview
on:
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_APP_VERSION: pr-${{ github.event.pull_request.number }}
          NEXT_PUBLIC_BASE_URL: https://devpockit.hypkey.com
      - uses: actions/upload-pages-artifact@v3
        with: { path: ./out }
      - id: deployment
        uses: actions/deploy-pages@v4
