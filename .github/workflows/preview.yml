name: Preview
# Builds PRs and uploads artifact only (no Pages deploy — single site).
# Download artifact from Actions tab to preview locally: npx serve out/
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_APP_VERSION: pr-${{ github.event.pull_request.number }}
          NEXT_PUBLIC_BASE_URL: https://devpockit.yuirei.com
      - uses: actions/upload-artifact@v4
        with:
          name: preview-pr-${{ github.event.pull_request.number }}
          path: ./out
          retention-days: 7
