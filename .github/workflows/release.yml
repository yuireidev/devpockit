# Release: build + GitHub Release for a version. No Pages deploy (see deploy.yml).
# Triggered by: tag push (v*), manual dispatch, or auto-tag.yml via workflow_call.
name: Create Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 0.2.3)'
        required: true
        type: string
      tag:
        description: 'Tag (default v{version})'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version (e.g., 0.2.3)'
        required: true
        type: string
      tag:
        description: 'Tag (e.g., v0.2.3)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag_version.outputs.version }}
      tag_name: ${{ steps.tag_version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag_version
        run: |
          # NOTE: github.event_name inside a workflow_call callee is the CALLER's
          # event (push), not "workflow_call". Decide on input presence instead.
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG="v$VERSION"
            fi
          else
            VERSION=${GITHUB_REF#refs/tags/v}
            TAG=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm test:ci
      - name: Install Chromium for release smoke test
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser smoke suite
        run: pnpm e2e
      - run: pnpm build
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ steps.tag_version.outputs.version }}
      - uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: out/
          retention-days: 30
  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build release notes from CHANGELOG
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          TAG="${{ needs.build.outputs.tag_name }}"
          if [ -f "CHANGELOG.md" ]; then
            awk -v start="## [$VERSION]" '
              $0 == start {insec=1; next}
              insec && /^## \[/ {insec=0}
              insec {print}
            ' CHANGELOG.md > /tmp/release_notes.md || true
            if [ ! -s /tmp/release_notes.md ]; then
              echo "See CHANGELOG.md for details." > /tmp/release_notes.md
            fi
            {
              echo "## Release $VERSION"
              echo ""
              cat /tmp/release_notes.md
              echo ""
              echo "---"
              echo ""
              PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
              if [ -n "$PREV_TAG" ]; then
                echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...$TAG"
              else
                echo "**Full Changelog**: https://github.com/${{ github.repository }}/releases/tag/$TAG"
              fi
            } > /tmp/release_body.md
          else
            {
              echo "## Release $VERSION"
              echo ""
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/$TAG"
            } > /tmp/release_body.md
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ needs.build.outputs.version }}
          tag_name: ${{ needs.build.outputs.tag_name }}
          body_path: /tmp/release_body.md
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
