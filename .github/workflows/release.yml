# Release: tag v* (or manual dispatch) -> build -> github-release -> deploy Pages.
# Tag is source of truth; version-check.yml enforces package.json match.
name: Create Release and Deploy
'on':
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version: { description: 'Version (e.g., 0.2.3)', required: true, type: string }
      tag: { description: 'Tag (default v{version})', required: false, type: string }
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: tag_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"; TAG="${{ inputs.tag }}"; [ -z "$TAG" ] && TAG="v$VERSION"
          else
            VERSION=${GITHUB_REF#refs/tags/v}; TAG=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT; echo "tag_name=$TAG" >> $GITHUB_OUTPUT
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm test:ci
      - run: pnpm build
        env: { NEXT_PUBLIC_APP_VERSION: ${{ steps.tag_version.outputs.version }} }
      - uses: anchore/sbom-action@v0
        with: { path: ./, format: spdx-json, output-file: sbom.spdx.json }
      - uses: actions/upload-pages-artifact@v3
        with: { path: ./out }
      - uses: actions/upload-artifact@v4
        with: { name: build-${{ steps.tag_version.outputs.version }}, path: out/, retention-days: 30 }
  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: release-drafter/release-drafter@v6
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    permissions: { pages: write, id-token: write }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
