# Version guard.
# - Tag push: tag must equal package.json (tag is truth, package.json mirrors it).
# - PR into main: only release/* or chore/release-* head branches must bump the
#   version above the latest tag. Feature/fix PRs skip (fail-closed for releases).
name: Version Check
on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG != package.json $PKG"
            exit 1
          fi
          echo "version $TAG matches"
      - name: Release branch must bump version
        if: github.event_name == 'pull_request'
        run: |
          HEAD_BRANCH="${{ github.event.pull_request.head.ref }}"
          case "$HEAD_BRANCH" in
            release/*|chore/release-*) ;;
            *)
              echo "Not a release branch ($HEAD_BRANCH); version bump not required"
              exit 0
              ;;
          esac
          git fetch origin main --tags
          LATEST=$(git tag --list 'v*' | sort -V | tail -1 || echo "")
          LATEST_VER="${LATEST#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "release PR package.json=$PKG latest_tag=$LATEST"
          if [ -z "$LATEST" ]; then
            echo "No tags yet, bump check passes"
            exit 0
          fi
          HIGHER=$(printf '%s\n%s' "$LATEST_VER" "$PKG" | sort -V | tail -1)
          if [ "$HIGHER" != "$PKG" ] || [ "$PKG" = "$LATEST_VER" ]; then
            echo "package.json $PKG is not newer than latest tag $LATEST"
            echo "Release branches must bump the version (pnpm release:patch|minor|major)."
            exit 1
          fi
          echo "Version bump $LATEST_VER -> $PKG OK"
