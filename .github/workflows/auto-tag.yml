# Auto-tag: on push to main, tag the merge commit when package.json
# is newer than the latest v* tag, then run the release (build + GitHub Release).
# Pages deploy is manual via deploy.yml. No action when version is unchanged.
name: Auto Tag Release
on:
  push:
    branches:
      - main
permissions:
  contents: write
concurrency:
  group: auto-tag-main
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.compare.outputs.should_release }}
      version: ${{ steps.compare.outputs.version }}
      tag: ${{ steps.compare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: compare
        run: |
          PKG=$(node -p "require('./package.json').version")
          LATEST=$(git tag --list 'v*' | sort -V | tail -1 || echo "")
          LATEST_VER="${LATEST#v}"
          echo "package.json=$PKG latest_tag=$LATEST"
          SHOULD="false"
          if [ -n "$PKG" ]; then
            if [ -z "$LATEST" ]; then
              SHOULD="true"
            else
              HIGHER=$(printf '%s\n%s' "$LATEST_VER" "$PKG" | sort -V | tail -1)
              if [ "$HIGHER" = "$PKG" ] && [ "$PKG" != "$LATEST_VER" ]; then
                SHOULD="true"
              fi
            fi
          fi
          if [ "$SHOULD" = "true" ] && git rev-parse "v$PKG" >/dev/null 2>&1; then
            echo "Tag v$PKG already exists, skipping"
            SHOULD="false"
          fi
          echo "should_release=$SHOULD" >> $GITHUB_OUTPUT
          echo "version=$PKG" >> $GITHUB_OUTPUT
          echo "tag=v$PKG" >> $GITHUB_OUTPUT
      - name: Create and push tag
        if: steps.compare.outputs.should_release == 'true'
        run: |
          VERSION="${{ steps.compare.outputs.version }}"
          TAG="${{ steps.compare.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "$TAG"
  release:
    needs: tag
    if: needs.tag.outputs.should_release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.tag.outputs.version }}
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
